[project]
name = "sfrag"
version = "0.1.0"
description = "Salesforce Universal Documentation & RAG Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.12",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "qdrant-client>=1.12",
    "watchfiles>=0.22",
    "datasketch>=1.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "tokenizers>=0.19",
    "python-multipart>=0.0.33",
]

[project.optional-dependencies]
# Heavy local models (bge-m3 + bge-reranker-v2-m3). Install on the target machine:
#   uv sync --extra models
models = [
    "FlagEmbedding>=1.3",
    "torch>=2.3",
    "transformers>=4.44",
]

[project.scripts]
sfrag = "sfrag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfrag"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]  # B008: FastAPI/Typer dependency idiom

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
